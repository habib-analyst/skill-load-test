[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-load-test"
version = "0.1.0"
description = "The open harness that measures whether agents load the right skills at scale"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Habib Ur Rehman" }]
keywords = ["agent-skills", "llm-agents", "evaluation", "retrieval", "reliability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/habib-analyst/skill-load-test"

[project.scripts]
skill-load-test = "skill_load_test.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
